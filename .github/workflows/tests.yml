name: Tests

# The reminder engine once failed in a way that produced no error at all.
# Running these checks on every push is the only thing that catches that class
# of defect before it reaches a working kitchen.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step: the project ships no dependencies and no build,
      # so there is nothing to restore.
      - name: Run the suite
        run: node test/run.js

      - name: Check the backend parses
        run: node --check backend/google_apps_script.js

      - name: Check the Mini App's script parses
        run: |
          sed -n '/^<script>$/,/^<\/script>$/p' index.html | sed '1d;$d' > /tmp/app.js
          node --check /tmp/app.js

      - name: Fail if a real secret was committed
        run: |
          if grep -nE '[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}' -r . --exclude-dir=.git; then
            echo "::error::A Telegram bot token appears to be committed. Secrets belong in Script Properties."
            exit 1
          fi
          if grep -n 'script.google.com/macros/s/AKfy' index.html; then
            echo "::error::A real deployment URL is committed in index.html."
            exit 1
          fi
          echo "No secrets found."
